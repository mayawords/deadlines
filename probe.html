<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Deadline Tracker: проба на входа</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body { font: 16px/1.45 system-ui, sans-serif; margin: 0 auto; max-width: 560px; padding: 16px; color: #1c1c1c; }
  h1 { font-size: 20px; }
  button { font: inherit; padding: 10px 14px; margin: 4px 4px 4px 0; border: 1px solid #888; border-radius: 8px; background: #fff; }
  #out div { padding: 6px 8px; margin: 4px 0; border-radius: 6px; background: #f1f1f1; word-break: break-word; }
  #out .ok { background: #dff3df; } #out .no { background: #fbe0e0; }
  .muted { color: #666; font-size: 14px; }
</style>
</head>
<body>
<h1>Deadline Tracker: проба на входа</h1>
<p id="cfg" class="muted"></p>
<div id="gbtn"></div>
<p id="who" class="muted">Няма вход с Google на тази страница.</p>
<p>
  <button data-t="google">1. Заявка с Google токена</button>
  <button data-t="session">2. Заявка със сесията</button>
  <button data-t="none">3. Заявка без вход</button>
  <button data-t="bad">4. Заявка с подправен токен</button>
  <button id="forget">Забрави сесията</button>
</p>
<div id="out"></div>
<script>
// Probe page. The script id (s) and the OAuth client id (c) come after # in the link and are kept
// in localStorage, so the public repository holds neither of them.
(function () {
  var KEY = 'dt-probe-cfg', SKEY = 'dt-probe-session';
  var cfg = {}, idToken = '';
  try { cfg = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
  var h = new URLSearchParams(location.hash.slice(1));
  if (h.get('s') && h.get('c')) {
    cfg = { s: h.get('s'), c: h.get('c') };
    try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {}
    history.replaceState(null, '', location.pathname);
  }
  var $ = function (id) { return document.getElementById(id); };
  function line(text, cls) {
    var d = document.createElement('div');
    d.className = cls || '';
    d.textContent = new Date().toLocaleTimeString('bg-BG') + '  ' + text;
    $('out').prepend(d);
  }
  function session() { try { return localStorage.getItem(SKEY) || ''; } catch (e) { return ''; } }
  function standalone() {
    return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  }
  function call(fn, extra, label) {
    var body = Object.assign({ fn: fn, label: label + (standalone() ? ' (икона)' : ''), ua: navigator.userAgent }, extra);
    return fetch('https://script.google.com/macros/s/' + cfg.s + '/exec', {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body)
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.ok) line(label + ': ДОСТЪП, скриптът вижда ' + j.result.email + ' (през ' + j.result.via + ')', 'ok');
      else line(label + ': ОТКАЗ, ' + j.error, 'no');
      return j;
    }).catch(function (err) { line(label + ': няма връзка, ' + err, 'no'); });
  }
  function payload(t) {
    try {
      var b = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(decodeURIComponent(escape(atob(b))));
    } catch (e) { return {}; }
  }
  function onCredential(resp) {
    idToken = resp.credential || '';
    var p = payload(idToken);
    $('who').textContent = 'Google вход: ' + (p.email || '?') + ', токенът важи до ' +
      (p.exp ? new Date(p.exp * 1000).toLocaleTimeString('bg-BG') : '?') +
      (resp.select_by ? ' (' + resp.select_by + ')' : '');
    call('login', { idToken: idToken }, 'Вход').then(function (j) {
      if (j && j.ok && j.result.session) { try { localStorage.setItem(SKEY, j.result.session); } catch (e) {} }
    });
  }
  if (!cfg.s || !cfg.c) {
    $('cfg').textContent = 'Отвори страницата от линка с #s=...&c=...';
    return;
  }
  $('cfg').textContent = 'Настройките са запомнени на това устройство.' + (session() ? ' Има запазена сесия.' : ' Няма запазена сесия.');
  window.addEventListener('load', function () {
    if (!window.google || !google.accounts) { line('Библиотеката на Google не се зареди.', 'no'); return; }
    google.accounts.id.initialize({ client_id: cfg.c, callback: onCredential, auto_select: true });
    google.accounts.id.renderButton($('gbtn'), { theme: 'outline', size: 'large', locale: 'bg' });
    google.accounts.id.prompt();
  });
  document.querySelectorAll('button[data-t]').forEach(function (b) {
    b.addEventListener('click', function () {
      var t = b.getAttribute('data-t');
      if (t === 'google') {
        if (!idToken) return line('Първо влез с бутона на Google.', 'no');
        call('whoami', { idToken: idToken }, 'Google токен');
      } else if (t === 'session') {
        if (!session()) return line('Няма запазена сесия: първо влез с Google.', 'no');
        call('whoami', { session: session() }, 'Сесия');
      } else if (t === 'none') {
        call('whoami', {}, 'Без вход');
      } else {
        var bad = idToken ? idToken.slice(0, -6) + 'AAAAAA' : 'aaa.bbb.ccc';
        call('whoami', { idToken: bad }, 'Подправен токен');
        if (session()) call('whoami', { session: session().slice(0, -4) + 'AAAA' }, 'Подправена сесия');
      }
    });
  });
  $('forget').addEventListener('click', function () {
    try { localStorage.removeItem(SKEY); } catch (e) {}
    if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
    line('Сесията е забравена на това устройство.');
  });
})();
</script>
</body>
</html>
